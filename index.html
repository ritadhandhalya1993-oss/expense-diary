<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cloud Diary</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --primary: #2c3e50; --secondary: #27ae60; --danger: #e74c3c; }
    body { font-family: sans-serif; background:#f4f7f6; padding:10px; margin:0; }
    .box { background:white; padding:15px; margin-bottom:15px; border-radius:12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, select, button { padding:12px; margin-bottom:10px; width:100%; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
    button { cursor: pointer; font-weight: bold; border: none; }
    .btn-add { background: var(--secondary); color: white; }
    .btn-export { background: #3498db; color: white; }
    .btn-delete { background: var(--danger); color: white; width: auto; padding: 5px 10px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: var(--primary); color: white; }
  </style>
</head>
<body>

<h2>💰 My Cloud Diary</h2>

<div class="box">
  <div style="display:flex; justify-content: space-around; text-align:center;">
    <div>Balance: <h3 id="balance">0</h3></div>
    <div>Expense: <h3 id="totalExpense">0</h3></div>
  </div>
</div>

<div class="box">
  <input type="date" id="date">
  <input type="text" id="source" placeholder="વિગત">
  <input type="number" id="income" placeholder="આવક (In)">
  <input type="number" id="expense" placeholder="ખર્ચ (Out)">
  <select id="type">
    <option>General</option><option>Milk</option><option>Petrol</option>
    <option>Grocery</option><option>EMI</option><option>Food</option><option>Other</option>
  </select>
  <button id="addBtn" class="btn-add" onclick="addData()">➕ Add to Cloud</button>
</div>

<div class="box">
  <input type="month" id="monthFilter" onchange="render()">
  <button class="btn-export" onclick="exportCSV()">📥 Download CSV (Excel)</button>
</div>

<div class="box" style="overflow-x:auto;">
  <table>
    <thead><tr><th>તારીખ</th><th>વિગત</th><th>In</th><th>Out</th><th>Action</th></tr></thead>
    <tbody id="tableData"></tbody>
  </table>
</div>

<script>
// તમારા નવા પ્રોજેક્ટ ("My diary") ની વિગતો
const firebaseConfig = {
  apiKey: "AIzaSyB36TOfy-NXVSNk_G7336TOfy-NXVSNk",
  authDomain: "my-diary-3a4d6.firebaseapp.com",
  projectId: "my-diary-3a4d6",
  storageBucket: "my-diary-3a4d6.firebasestorage.app",
  messagingSenderId: "984176703180",
  appId: "1:984176703180:web:4434237887754f923be9f5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let data = [];

document.getElementById('date').valueAsDate = new Date();
document.getElementById('monthFilter').value = new Date().toISOString().slice(0, 7);

async function addData() {
  const btn = document.getElementById('addBtn');
  const entry = {
    date: document.getElementById('date').value,
    source: document.getElementById('source').value || "General",
    amount: Number(document.getElementById('income').value) || 0,
    expense: Number(document.getElementById('expense').value) || 0,
    type: document.getElementById('type').value
  };

  btn.disabled = true;
  btn.innerText = "સેવિંગ...";
  try {
    await db.collection("finance").add(entry);
    document.getElementById('income').value = "";
    document.getElementById('expense').value = "";
    document.getElementById('source').value = "";
  } catch(e) { alert("Error: " + e.message); }
  btn.disabled = false;
  btn.innerText = "➕ Add to Cloud";
}

db.collection("finance").orderBy("date", "desc").onSnapshot(snap => {
  data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  render();
});

function render() {
  let inTotal = 0, exTotal = 0, html = "";
  const month = document.getElementById('monthFilter').value;
  data.filter(d => d.date.startsWith(month)).forEach(d => {
    inTotal += d.amount; exTotal += d.expense;
    html += `<tr><td>${d.date}</td><td>${d.source}</td><td>${d.amount}</td><td>${d.expense}</td>
    <td><button class="btn-delete" onclick="deleteDoc('${d.id}')">❌</button></td></tr>`;
  });
  document.getElementById('tableData').innerHTML = html;
  document.getElementById('balance').innerText = inTotal - exTotal;
  document.getElementById('totalExpense').innerText = exTotal;
}

function exportCSV() {
  let csv = "Date,Source,Income,Expense,Type\n";
  data.forEach(d => { csv += `${d.date},${d.source},${d.amount},${d.expense},${d.type}\n`; });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Diary_Export.csv';
  a.click();
}

async function deleteDoc(id) { if(confirm("Delete?")) await db.collection("finance").doc(id).delete(); }
</script>
</body>
</html>
